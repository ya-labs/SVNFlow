<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVNFlow</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="toolbar">
        <button type="button" class="toolbar-button toolbar-environment" data-role="environment-picker" aria-haspopup="menu">
          <span class="toolbar-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.5 2.5 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.5 2.5 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.25.25 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/></svg>
          </span>
          <span class="toolbar-text">
            <span class="toolbar-label">Projeto atual</span>
            <span class="toolbar-value" data-role="environment-name">Nenhum projeto</span>
          </span>
          <span class="toolbar-caret" aria-hidden="true">▾</span>
        </button>
        <button type="button" class="toolbar-button" data-role="branch-picker" aria-haspopup="menu" disabled>
          <span class="toolbar-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16"><path d="M9.5 3.25a2.25 2.25 0 1 1 3 2.122V6A2.5 2.5 0 0 1 10 8.5H6a1 1 0 0 0-1 1v1.128a2.251 2.251 0 1 1-1.5 0V5.372a2.25 2.25 0 1 1 1.5 0v1.836A2.493 2.493 0 0 1 6 7h4a1 1 0 0 0 1-1v-.628A2.25 2.25 0 0 1 9.5 3.25Zm-6 0a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Zm8.25-.75a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5ZM4.25 12a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Z"/></svg>
          </span>
          <span class="toolbar-text">
            <span class="toolbar-label">Branch Git</span>
            <span class="toolbar-value" data-role="git-branch">-</span>
          </span>
          <span class="toolbar-caret" aria-hidden="true">▾</span>
        </button>
        <button type="button" class="toolbar-button" data-role="refresh">
          <span class="toolbar-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16"><path d="M1.705 8.005a.75.75 0 0 1 .834.656 5.5 5.5 0 0 0 9.592 2.97l-1.204-1.204a.25.25 0 0 1 .177-.427h3.646a.25.25 0 0 1 .25.25v3.646a.25.25 0 0 1-.427.177l-1.38-1.38A7.002 7.002 0 0 1 1.05 8.84a.75.75 0 0 1 .656-.834ZM8 2.5a5.487 5.487 0 0 0-4.131 1.869l1.204 1.204A.25.25 0 0 1 4.896 6H1.25A.25.25 0 0 1 1 5.75V2.104a.25.25 0 0 1 .427-.177l1.38 1.38A7.002 7.002 0 0 1 14.95 7.16a.75.75 0 0 1-1.49.178A5.5 5.5 0 0 0 8 2.5Z"/></svg>
          </span>
          <span class="toolbar-text">
            <span class="toolbar-label" data-role="refresh-label">Verificar alterações</span>
            <span class="toolbar-value" data-role="refresh-value">Comparar Git com o SVN</span>
          </span>
        </button>
        <span class="toolbar-spacer"></span>
        <button type="button" class="toolbar-link" data-role="open-repositories">Repositórios</button>
        <button type="button" class="toolbar-link" data-role="appearance">Aparência</button>
        <button type="button" class="toolbar-link" data-role="toggle-advanced">Modo avançado</button>
      </header>

      <div class="dropdown" data-role="environment-menu" hidden></div>
      <div class="dropdown" data-role="branch-menu" hidden></div>

      <main class="desktop" data-role="desktop-view">
        <aside class="sidebar">
          <div class="tabs" role="tablist">
            <button type="button" class="tab" role="tab" data-tab="changes">Alterações <span class="counter" data-role="changes-counter">0</span></button>
            <button type="button" class="tab" role="tab" data-tab="history">Histórico</button>
          </div>
          <div class="sidebar-list" data-role="sidebar-list"></div>
          <div class="commit-box" data-role="commit-box"></div>
        </aside>
        <section class="detail" data-role="detail" aria-live="polite"></section>
      </main>

      <main class="repos" data-role="repos-view" hidden>
        <aside class="sidebar">
          <div class="list-header">Servidores SVN</div>
          <div class="sidebar-list" data-role="repo-roots"></div>
          <div class="commit-box">
            <button type="button" class="button primary block" data-role="add-root">Adicionar URL…</button>
          </div>
        </aside>
        <section class="detail" data-role="repo-browser" aria-live="polite"></section>
      </main>

      <main class="advanced" data-role="advanced-view" hidden>
        <aside class="advanced-nav">
          <p class="advanced-nav-title">Modo avançado</p>
          <nav aria-label="Etapas do modo avançado">
            <ul class="stage-list" data-role="stage-list"></ul>
          </nav>
        </aside>
        <section class="advanced-content">
          <h2 data-role="stage-title">Ambiente</h2>
          <p class="advanced-description" data-role="stage-description"></p>
          <div class="stage-body" data-role="stage-body"></div>
        </section>
      </main>

      <footer class="statusbar">
        <span data-role="app-status">Iniciando...</span>
        <span class="statusbar-version" data-role="app-version"></span>
      </footer>
    </div>

    <div class="busy-indicator" data-role="busy-indicator" role="status" aria-live="polite" hidden>
      <div class="busy-bar"></div>
      <div class="busy-pill"><span class="busy-spinner" aria-hidden="true"></span><span data-role="busy-label"></span></div>
    </div>

    <div class="modal-backdrop" data-role="modal" hidden></div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
